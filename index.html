<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Store Mall | Shop Everything You Need</title>
  <meta name="description" content="Super Store Mall – Your one-stop online mall for shopping everything you need. Explore fashion, gadgets, groceries, and more at unbeatable prices.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="./style/index.css">
</head>
<body>
  <!-- Header -->
  <header id="top">
    <h1>🛒 Super Store Mall</h1>
    <p class="tagline">Shop everything you need, all in one place!</p>
  </header>

  <!-- Navigation -->
  <nav>
    <a href="index.html" class="active">Home</a> |
    <a href="about.html">About Us</a> |
    <a href="contact.html">Contact Us</a>
  </nav>
  
  <!-- Announcement / Promo -->
  <section class="announcement">
    <marquee>✨ Welcome to <strong>Super Store Mall</strong> Enjoy the best shopping experience with exclusive deals! 🛍️</marquee>
  </section>

  <!-- Side Social Links -->
  <aside class="social-bar">
    <a href="https://www.facebook.com/" target="_blank" aria-label="Facebook"><i class="fa fa-facebook"></i></a>
    <a href="https://twitter.com/" target="_blank" aria-label="Twitter"><i class="fa fa-twitter"></i></a>
    <a href="https://www.instagram.com/" target="_blank" aria-label="Instagram"><i class="fa fa-instagram"></i></a>
  </aside>

  <!-- Main Content -->
  <main>
    <!-- Product Gallery -->
    <section class="gallery" id="middle">
      <h2>Explore Our Collections</h2>
      <div class="gallery-images">
        <figure>
          <img src="./images/i1.png" alt="Trendy Shoes">
        </figure>
        <figure>
          <img src="./images/12.png" alt="Smart Watch">
        </figure>
        <figure>
          <img src="./images/13.png" alt="Fashion Bag">
        </figure>
        <figure>
          <img src="./images/14.png" alt="Headphones">
        </figure>
        <figure>
          <img src="./images/15.png" alt="Sunglasses">
        </figure>
        <figure>
          <img src="./images/16.png" alt="Casual Outfit">
        </figure>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <nav>
      <a href="index.html">Home</a> |
      <a href="about.html">About Us</a> |
      <a href="contact.html">Contact Us</a>
    </nav>
    <div class="bottom-links">
      <a href="#top">⬆ Back to Top</a> |
      <a href="#middle">⬇ Middle of Page</a> |
      &copy; 2025 Super Store Mall
    </div>
  </footer>
</body>
</html>
